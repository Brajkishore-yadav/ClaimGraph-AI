version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=claimgraph
      - POSTGRES_USER=claimuser
      - POSTGRES_PASSWORD=claimpass
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=claimgraphpass
    depends_on:
      - postgres
      - neo4j

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: claimgraph
      POSTGRES_USER: claimuser
      POSTGRES_PASSWORD: claimpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/claimgraphpass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
